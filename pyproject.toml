[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "orchestrai-mace-range-al"
version = "0.1.0"
description = "MACE-RANGE adapter for Orchestr.AI-compatible active-learning postprocessing"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "PyYAML>=6.0",
  "ase>=3.23",
  "scipy>=1.10",
  "scikit-learn>=1.3",
  "joblib>=1.3",
  "matplotlib>=3.7",
  "dscribe>=2.1",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
orchestr-range-al = "orchestr_range_al.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
